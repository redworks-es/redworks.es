sections:
  - heading: "Qu'est-ce que la téléphonie VoIP ?"
    body: >-
      La téléphonie VoIP transmet les appels vocaux numérisés via internet
      plutôt que par le réseau téléphonique traditionnel, ce qui permet de
      gérer les appels depuis des téléphones IP, ordinateurs ou mobiles avec
      un seul standard. Nous installons, configurons et formons votre équipe
      à l'utilisation de toute la solution, y compris la portabilité de votre
      numérotation actuelle.
    image: ../telefonia-voip/section-0.jpg
  - heading: Services téléphoniques
    body: >-
      Toutes les technologies pour tirer le meilleur parti de vos
      communications. Chez Redworks, nous travaillons toujours avec les
      meilleures technologies pour offrir un service personnalisé et
      actualisé, en tirant parti des avancées technologiques du moment pour
      rester à la pointe.
    image: ../telefonia-voip/section-1.jpg
  - heading: Câblages et infrastructures
    body: >-
      Un câblage correct est la base du bon fonctionnement des installations.
      Un câblage de qualité est indispensable pour réaliser une installation
      correcte de tout système de communications.
    image: ../telefonia-voip/section-2.jpg

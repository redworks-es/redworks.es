sections:
  - heading: À quoi servent les panneaux solaires ?
    body: >-
      L'installation de panneaux solaires photovoltaïques est un système
      permettant d'exploiter l'énergie solaire et de la convertir en
      électricité. Nous utilisons ce type d'installation pour produire une
      électricité propre et renouvelable.
  - heading: Prix
    body: >-
      Nous comprenons l'importance de vous offrir une solution technologique,
      mais aussi rentable. Nous proposons des prix compétitifs sans
      compromettre la qualité de nos produits et services. Nous croyons
      fermement à vous fournir une information honnête et claire sur les
      coûts associés au processus ; contactez-nous pour obtenir votre devis.
  - heading: Subventions et aides
    body: >-
      Il existe différents programmes de subventions et d'avantages fiscaux.
      Notre équipe vous conseillera sur les options disponibles et vous
      aidera à tirer le meilleur parti de ces opportunités. Programme d'aides
      (Pareer III) géré par l'IDAE, réductions fiscales de taxe foncière et de
      taxe sur les constructions, aides du Gouvernement central pouvant
      atteindre 3 000 €. Pour plus d'informations sur les programmes d'aide,
      contactez-nous. En profitant de ces incitations, vous pouvez réduire de
      près de moitié le coût d'installation des panneaux solaires.

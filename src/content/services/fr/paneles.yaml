  - heading: Maintenance
    body: >-
      Une fois les panneaux solaires installés, un entretien adapté se
      traduit par des bénéfices à long terme pour vous, comme la
      prolongation de leur durée de vie.
  - heading: Permis
    body: >-
      L'obtention de plusieurs permis est nécessaire, car cela implique des
      modifications de la propriété. Cela dit, les permis requis dépendent de
      chaque cas particulier. Nous nous chargeons de rendre ce processus
      aussi simple et confortable que possible. Nous vous expliquons tout ce
      que vous devez savoir sur les permis nécessaires à l'installation des
      panneaux solaires.
  - heading: Garantie
    body: ""
  - heading: "L'autoconsommation, la nouvelle alternative"
    body: >-
      La technologie solaire a considérablement progressé en termes
      d'efficacité et de coût ces dernières années, rendant les systèmes
      d'autoconsommation plus accessibles et plus performants. Cette
      alternative est de plus en plus populaire et attractive dans le domaine
      de l'énergie, où nous sommes experts.

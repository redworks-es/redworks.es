sections:
  - heading: "Qu'est-ce qu'une installation électrique basse tension ?"
    body: >-
      Une installation électrique basse tension est celle qui fonctionne avec
      une tension inférieure à 1 000 volts en courant alternatif ou 1 500
      volts en courant continu. Ce type d'installation se trouve dans la
      plupart des logements, locaux commerciaux et bâtiments.
  - heading: Service d'installation de nouveaux systèmes électriques
    body: >-
      Chez Redworks Solutions, nous proposons une large gamme de services
      d'installation électrique basse tension, parmi lesquels :
  - heading: "Pourquoi choisir l'installation électrique basse tension ?"
    body: >-
      L'installation électrique basse tension s'impose comme l'option la plus
      courante et la plus pertinente pour la majorité des applications, pour
      plusieurs raisons :
  - heading: Maintenance et réglages
    body: >-
      Notre entreprise propose également des services de maintenance et de
      réglage des systèmes électriques basse tension. Il s'agit d'une série
      de tâches routinières à réaliser périodiquement, comme l'inspection
      visuelle des câbles, connexions et composants, la vérification du bon
      fonctionnement des dispositifs de protection, le nettoyage des contacts
      et la mesure des tensions et courants. Les réglages des systèmes
      électriques basse tension visent à optimiser leur rendement et leur
      efficacité. Cela implique l'étalonnage des dispositifs de protection,
      la régulation des tensions et courants, et l'optimisation de la
      consommation énergétique en fonction des besoins spécifiques de chaque
      installation.

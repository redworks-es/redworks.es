sections:
  - heading: "Qu'est-ce que le câblage structuré ?"
    body: >-
      Le câblage structuré est l'infrastructure réseau physique (cuivre et
      fibre optique) qui relie postes de travail, serveurs et équipements
      réseau au sein d'un bâtiment ou entre plusieurs sites. Une installation
      correctement dimensionnée évite les goulots d'étranglement et facilite
      les futures extensions sans avoir à recâbler.
  - heading: Câblages voix et données
    body: >-

  - heading: "Qu'est-ce qu'un système de sonorisation et à quoi sert-il ?"
    body: >-
      Un système de sonorisation diffuse des annonces et de la musique
      d'ambiance via des haut-parleurs reliés à une centrale audio, en
      adaptant le volume et la couverture à chaque type d'espace. Dans le
      secteur industriel, nous concevons des solutions conformes aux normes
      EN-60849, EN-54/17 et à la classification ATEX ; dans les établissements
      scolaires, nous privilégions la diffusion rapide d'annonces aux élèves
      et au personnel ; et dans le retail, nous adaptons la sonorisation aux
      boutiques, salles de sport et espaces de loisirs.

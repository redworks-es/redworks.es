  - heading: "Qu'est-ce qu'un réseau wifi d'entreprise ?"
    body: >-
      Un réseau wifi d'entreprise est une installation de points d'accès
      professionnels, planifiée selon la surface et les matériaux du
      bâtiment, qui garantit une couverture stable pour des dizaines
      d'appareils connectés simultanément. Contrairement à un routeur
      domestique, il permet de segmenter le trafic et d'adapter la couverture
      par étage ou par zone :
  - heading: Systèmes Point à Point
    body: >-
      Pour répondre au besoin de relier des sites et emplacements sur de
      grandes distances, les systèmes sans fil offrent une solution des plus
      flexibles. Les systèmes point à point permettent d'établir une
      communication directe et efficace entre deux appareils. Ils apportent
      efficacité, sécurité renforcée, faible latence et flexibilité, ce qui en
      fait un choix précieux pour de nombreuses applications, de la
      connectivité longue distance à la configuration de réseaux spécifiques
